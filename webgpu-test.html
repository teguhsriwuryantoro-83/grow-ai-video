<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>GROW AI WebGPU Test</title><style>*{box-sizing:border-box}body{margin:0;background:#050914;color:#eef7ff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 18px 40px}.card{background:#0b1424;border:1px solid #1d3656;border-radius:20px;padding:20px;box-shadow:0 0 30px #006cff22}h1{margin:0 0 5px;font-size:28px}.sub{color:#8ca5c3;margin-bottom:22px}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#132238;margin:4px 5px 4px 0;font-size:13px}button{width:100%;border:0;border-radius:15px;padding:16px;font-size:16px;font-weight:800;margin-top:14px;background:#25a7ff;color:#00111d}button:disabled{opacity:.45}.bar{height:12px;background:#17243a;border-radius:20px;overflow:hidden;margin-top:18px}.fill{height:100%;width:0;background:linear-gradient(90deg,#22a8ff,#55f5e0);transition:.25s}#log{white-space:pre-wrap;background:#03070d;border-radius:14px;padding:14px;margin-top:14px;min-height:150px;color:#b9d9ff;font-family:monospace;font-size:12px}canvas{width:100%;margin-top:15px;border-radius:14px;background:#02050a}</style></head><body><div class="wrap"><div class="card"><h1>GROW AI</h1><div class="sub">WebGPU HTTPS Engine Test</div><div><span class="badge" id="https">Secure context: …</span><span class="badge" id="gpu">WebGPU: …</span></div><button id="test">TEST GPU SEKARANG</button><div class="bar"><div class="fill" id="fill"></div></div><div id="log">Siap. Tekan TEST GPU SEKARANG.</div><canvas id="cv" width="512" height="512"></canvas></div></div><script>const log=document.querySelector('#log'),fill=document.querySelector('#fill'),btn=document.querySelector('#test');function L(s){log.textContent+='\n'+s}function P(n){fill.style.width=n+'%'}document.querySelector('#https').textContent='Secure context: '+(isSecureContext?'YA':'TIDAK');document.querySelector('#gpu').textContent='WebGPU API: '+(navigator.gpu?'ADA':'TIDAK');btn.onclick=async()=>{log.textContent='Mulai pemeriksaan…';P(5);btn.disabled=true;try{if(!navigator.gpu)throw Error('navigator.gpu tidak tersedia. Pastikan Chrome terbaru.');L('✓ WebGPU API ditemukan');P(20);const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)throw Error('GPU adapter tidak diberikan browser meski halaman HTTPS.');L('✓ GPU adapter aktif');P(40);const device=await adapter.requestDevice();L('✓ WebGPU device berhasil dibuat');P(60);const code=`@group(0) @binding(0) var<storage,read_write> data:array<f32>;@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id:vec3<u32>){let i=id.x;if(i<262144u){let x=f32(i%512u)/511.0;let y=f32(i/512u)/511.0;data[i]=0.5+0.5*sin(x*30.0+y*20.0);}}`;const module=device.createShaderModule({code});const buf=device.createBuffer({size:262144*4,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});const read=device.createBuffer({size:262144*4,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});const layout=device.createBindGroupLayout({entries:[{binding:0,visibility:GPUShaderStage.COMPUTE,buffer:{type:'storage'}}]});const pipeline=device.createComputePipeline({layout:device.createPipelineLayout({bindGroupLayouts:[layout]}),compute:{module,entryPoint:'main'}});const bg=device.createBindGroup({layout,entries:[{binding:0,resource:{buffer:buf}}]});const enc=device.createCommandEncoder(),pass=enc.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,bg);pass.dispatchWorkgroups(4096);pass.end();enc.copyBufferToBuffer(buf,0,read,0,262144*4);device.queue.submit([enc.finish()]);await read.mapAsync(GPUMapMode.READ);const a=new Float32Array(read.getMappedRange().slice(0));read.unmap();P(85);const c=document.querySelector('#cv'),ctx=c.getContext('2d'),im=ctx.createImageData(512,512);for(let i=0;i<a.length;i++){let v=Math.max(0,Math.min(255,a[i]*255));im.data[i*4]=v;im.data[i*4+1]=120;im.data[i*4+2]=255-v;im.data[i*4+3]=255}ctx.putImageData(im,0,0);P(100);L('✓ Compute shader berhasil dieksekusi GPU');L('✓ Data GPU berhasil dikembalikan ke browser');L('HASIL: WEBGPU HP INI BERFUNGSI.')}catch(e){P(0);L('✗ '+e.message);L('HASIL: tes gagal — screenshot log ini kirim ke saya.')}finally{btn.disabled=false}};</script></body></html>
