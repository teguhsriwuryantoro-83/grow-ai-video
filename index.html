<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>GROW AI VIDEO</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#13214a 0,#070a14 36%,#03050a 100%);color:#f5f8ff;font-family:Inter,system-ui,sans-serif;min-height:100vh}.app{max-width:620px;margin:auto;padding:22px 18px 40px}.brand{text-align:center;margin:8px 0 24px}.logo{width:70px;height:70px;border:1px solid #38dfff;border-radius:22px;margin:auto;display:grid;place-items:center;font-size:38px;font-weight:900;color:#78efff;box-shadow:0 0 30px #00c8ff66}.brand h1{font-size:25px;letter-spacing:4px}.brand p{color:#91a0bd;font-size:13px}.card{background:#0b1020cc;border:1px solid #253454;border-radius:24px;padding:17px}.drop{min-height:240px;border:1px dashed #3c638d;border-radius:19px;display:grid;place-items:center;overflow:hidden;position:relative;background:#070b15}.drop img{width:100%;height:100%;position:absolute;object-fit:contain}.drop input{display:none}.pick{z-index:2;padding:14px 20px;border-radius:14px;border:1px solid #2ad9ff;background:#102337;color:#dffaff;font-weight:800}.field{margin-top:15px}label{font-size:12px;color:#9db0cf;font-weight:800}textarea,select{width:100%;margin-top:7px;background:#070b15;border:1px solid #263957;border-radius:14px;color:white;padding:13px;font:inherit}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.go{width:100%;margin-top:18px;padding:17px;border:0;border-radius:16px;background:linear-gradient(90deg,#00c8ff,#786cff);color:white;font-size:16px;font-weight:900}.go:disabled{opacity:.55}.status{display:none;margin-top:15px;padding:13px;border-radius:13px;background:#10182a;color:#b9c9e7;font-size:13px;white-space:pre-line}.progress{display:none;margin-top:15px;padding:15px;border:1px solid #243b64;border-radius:16px;background:#080e1d}.progressTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900}.percent{font-size:25px;color:#61e9ff}.track{height:15px;background:#02050b;border:1px solid #243b64;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#00d9ff,#596bff,#a75cff);border-radius:999px;transition:width .5s}.phase{margin-top:9px;color:#aebfe0;font-size:12px}.result{display:none;margin-top:16px}.previewTitle{text-align:center;font-weight:900;margin:5px 0 8px;color:#76ecff;letter-spacing:1px}.result video{width:100%;border-radius:16px;background:#000;margin-top:6px;max-height:70vh}.download{display:none;text-align:center;text-decoration:none;color:white;border:1px solid #33dfff;padding:14px;border-radius:13px;margin-top:10px;font-weight:900;background:#0b1d31}.ready{font-size:12px;color:#9fc0dc;text-align:center;margin-top:8px}.foot{text-align:center;color:#566682;font-size:11px;margin-top:18px}</style></head><body><main class="app"><header class="brand"><div class="logo">G</div><h1>GROW AI VIDEO</h1><p>IMAGE → VIDEO • WAN 2.2 LIGHTNING</p></header><section class="card"><label class="drop" id="drop"><input id="file" type="file" accept="image/*"><span class="pick">＋ PILIH FOTO</span><img id="preview" hidden></label><div class="field"><label>PROMPT GERAKAN</label><textarea id="prompt"></textarea></div><div class="row"><div class="field"><label>DURASI</label><select id="duration"><option value="3.5">3.5 detik</option><option value="5" selected>5 detik</option><option value="10">10 detik • sambung otomatis</option></select></div><div class="field"><label>KUALITAS</label><select><option>Normal / stabil</option></select></div></div><button class="go" id="go">🎬 GENERATE VIDEO</button><div class="progress" id="progress"><div class="progressTop"><span>PROSES VIDEO</span><span class="percent" id="percent">0%</span></div><div class="track"><div class="bar" id="bar"></div></div><div class="phase" id="phase">Menyiapkan…</div></div><div class="status" id="status"></div><div class="result" id="result"><div class="previewTitle">▶ PREVIEW HASIL VIDEO</div><video id="video" controls playsinline preload="metadata"></video><div class="ready" id="ready">Memuat preview…</div><a class="download" id="download">⬇ DOWNLOAD VIDEO MP4</a></div></section><div class="foot">GROW AI VIDEO • WAN 2.2 • ZERO GPU</div></main><script type="module">const SPACE='Saravutw/WAN2.2_I2V_LIGHTNING_4-8step_custom';const $=x=>document.getElementById(x),file=$('file'),preview=$('preview'),go=$('go'),status=$('status');let timer,current=0,activeURL=null;$('drop').onclick=()=>file.click();file.onchange=()=>{if(file.files[0]){preview.src=URL.createObjectURL(file.files[0]);preview.hidden=false}};function say(t){status.style.display='block';status.textContent=t}function setP(n,t){current=Math.max(current,Math.min(100,Math.round(n)));$('progress').style.display='block';$('percent').textContent=current+'%';$('bar').style.width=current+'%';if(t)$('phase').textContent=t}function creep(to,t){clearInterval(timer);timer=setInterval(()=>{if(current<to)setP(current+1,t)},1100)}function stop(){clearInterval(timer)}function reset(){stop();current=0;setP(0,'Menyiapkan mesin AI…')}async function client(){setP(3,'Menghubungkan Wan 2.2…');creep(10,'Menghubungkan GPU gratis…');const m=await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');const c=await m.Client.connect(SPACE);stop();setP(10,'Mesin terhubung');return c}function urls(r){const a=[];const walk=x=>{if(!x)return;if(typeof x==='string'){if(x.startsWith('http'))a.push(x);return}if(Array.isArray(x))return x.forEach(walk);if(typeof x==='object'){if(x.url)walk(x.url);Object.values(x).forEach(walk)}};walk(r?.data);return [...new Set(a)]}async function getVideoBlob(r){for(const u of urls(r)){try{const q=await fetch(u);if(!q.ok)continue;const b=await q.blob();if(b.size>100000&&(b.type.includes('video')||u.includes('.mp4')||u.includes('/file=')))return b}catch(e){}}throw Error('File video dari server tidak dapat diamankan. Coba Generate lagi.')}async function make(c,image,prompt,seconds,start,end,label){setP(start,label);creep(end-2,label);const r=await c.predict('/generate_video',{input_image:image,last_image:null,prompt,steps:4,negative_prompt:'blurry, low quality, chaotic, deformed, watermark, bad anatomy, shaky camera',duration_seconds:seconds,guidance_scale:1,guidance_scale_2:1,seed:42,randomize_seed:true,quality:4,scheduler:'UniPCMultistep',flow_shift:3,frame_multiplier:16,safe_mode:true,video_component:true});stop();const b=await getVideoBlob(r);setP(end,label+' selesai');return b}async function lastFrame(blob){return new Promise((resolve,reject)=>{const v=document.createElement('video'),u=URL.createObjectURL(blob);v.muted=true;v.playsInline=true;v.onloadedmetadata=()=>{v.currentTime=Math.max(.1,v.duration-.08)};v.onseeked=()=>{const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{URL.revokeObjectURL(u);b?resolve(new File([b],'continue.jpg',{type:'image/jpeg'})):reject(Error('Gagal mengambil frame sambungan'))},'image/jpeg',.94)};v.onerror=()=>reject(Error('Gagal membaca video bagian 1'));v.src=u})}async function merge(b1,b2){setP(92,'Menyambungkan video final…');const [{FFmpeg},{toBlobURL}]=await Promise.all([import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm'),import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm')]);const ff=new FFmpeg();const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';const worker=new URL('./ffmpeg-worker.js',location.href).href;await ff.load({classWorkerURL:worker,coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')});setP(95,'Menggabungkan bagian 1 + 2…');await ff.writeFile('a.mp4',new Uint8Array(await b1.arrayBuffer()));await ff.writeFile('b.mp4',new Uint8Array(await b2.arrayBuffer()));await ff.writeFile('list.txt',new TextEncoder().encode("file 'a.mp4'\nfile 'b.mp4'\n"));let code=await ff.exec(['-f','concat','-safe','0','-i','list.txt','-c','copy','final.mp4']);if(code!==0)throw Error('Penyambungan MP4 gagal');const d=await ff.readFile('final.mp4');return new Blob([d.buffer],{type:'video/mp4'})}function showPreview(blob,name){if(activeURL)URL.revokeObjectURL(activeURL);activeURL=URL.createObjectURL(blob);const v=$('video'),d=$('download');d.style.display='none';$('ready').textContent='Memuat preview video…';$('result').style.display='block';v.src=activeURL;v.load();v.onloadedmetadata=()=>{$('ready').textContent='✅ Preview siap • Putar dan periksa video sebelum download';d.href=activeURL;d.download=name;d.style.display='block';v.scrollIntoView({behavior:'smooth',block:'center'})};v.onerror=()=>{$('ready').textContent='❌ Preview gagal dimuat';d.style.display='none'}}go.onclick=async()=>{if(!file.files[0])return say('Pilih foto dulu.');const p=$('prompt').value.trim();if(!p)return say('Isi prompt gerakan dulu.');go.disabled=true;$('result').style.display='none';$('download').style.display='none';status.style.display='none';reset();try{const c=await client(),dur=Number($('duration').value);if(dur===10){const b1=await make(c,file.files[0],p,5,11,43,'Membuat bagian 1/2…');setP(45,'Mengambil frame terakhir untuk sambungan…');const frame=await lastFrame(b1);const b2=await make(c,frame,p+' Continue exactly from this frame with natural continuous motion, same people, same scene, stable identity.',5,47,88,'Melanjutkan bagian 2/2…');const final=await merge(b1,b2);setP(99,'Menyiapkan preview hasil akhir…');showPreview(final,'grow-ai-video-10detik.mp4');setP(100,'✅ Video final siap dipreview');say('✅ SELESAI — 1 video final ±10 detik. Putar preview sebelum download.')}else{const b=await make(c,file.files[0],p,dur,11,96,'AI sedang membuat video…');showPreview(b,'grow-ai-video.mp4');setP(100,'✅ Video siap dipreview');say('✅ VIDEO SELESAI — periksa preview sebelum download.')}}catch(e){stop();$('phase').textContent='❌ Proses berhenti';say('⚠️ '+(e?.message||'Server sedang sibuk. Coba Generate lagi.'))}finally{go.disabled=false}};</script></body></html>
