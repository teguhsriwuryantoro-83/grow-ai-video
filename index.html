<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>GROW AI VIDEO</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#13214a 0,#070a14 36%,#03050a 100%);color:#f5f8ff;font-family:Inter,system-ui,sans-serif;min-height:100vh}.app{max-width:620px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom))}.brand{text-align:center;margin:8px 0 24px}.logo{width:70px;height:70px;border:1px solid #38dfff;border-radius:22px;margin:auto;display:grid;place-items:center;font-size:38px;font-weight:900;color:#78efff;box-shadow:0 0 30px #00c8ff66,inset 0 0 20px #00c8ff33}.brand h1{font-size:25px;letter-spacing:4px;margin:14px 0 5px}.brand p{color:#91a0bd;margin:0;font-size:13px}.card{background:#0b1020cc;border:1px solid #253454;border-radius:24px;padding:17px;box-shadow:0 18px 55px #0008}.drop{min-height:240px;border:1px dashed #3c638d;border-radius:19px;display:grid;place-items:center;text-align:center;overflow:hidden;position:relative;background:#070b15}.drop img{width:100%;height:100%;position:absolute;object-fit:contain;background:#05070c}.drop input{display:none}.pick{position:relative;z-index:2;padding:14px 20px;border-radius:14px;border:1px solid #2ad9ff;background:#102337;color:#dffaff;font-weight:800}.field{margin-top:15px}label{font-size:12px;color:#9db0cf;font-weight:800;letter-spacing:.8px}textarea,select{width:100%;margin-top:7px;background:#070b15;border:1px solid #263957;border-radius:14px;color:white;padding:13px;font:inherit;outline:none}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.go{width:100%;margin-top:18px;padding:17px;border:0;border-radius:16px;background:linear-gradient(90deg,#00c8ff,#786cff);color:white;font-size:16px;font-weight:900;letter-spacing:1px;box-shadow:0 0 25px #00c8ff44}.go:disabled{opacity:.5}.status{display:none;margin-top:15px;padding:13px;border-radius:13px;background:#10182a;color:#b9c9e7;font-size:13px;white-space:pre-line}.result{display:none;margin-top:16px}.result video{width:100%;border-radius:16px;background:#000}.download{display:block;text-align:center;text-decoration:none;color:white;border:1px solid #33dfff;padding:13px;border-radius:13px;margin-top:10px;font-weight:800}.foot{text-align:center;color:#566682;font-size:11px;margin-top:18px}.pulse{animation:p 1.3s infinite}@keyframes p{50%{box-shadow:0 0 34px #00d9ff99}}</style></head><body><main class="app"><header class="brand"><div class="logo">G</div><h1>GROW AI VIDEO</h1><p>IMAGE → CINEMATIC VIDEO • WAN 2.2 LIGHTNING</p></header><section class="card"><label class="drop" id="drop"><input id="file" type="file" accept="image/*"><span class="pick">＋ PILIH FOTO</span><img id="preview" hidden></label><div class="field"><label>PROMPT GERAKAN</label><textarea id="prompt" placeholder="Contoh: natural body movement, slow cinematic camera push in, realistic motion, stable face, detailed lighting"></textarea></div><div class="row"><div class="field"><label>DURASI</label><select id="duration"><option value="3.5">3.5 detik • cepat</option><option value="5" selected>5 detik</option><option value="8">8 detik</option><option value="10">10 detik • maksimum</option></select></div><div class="field"><label>KUALITAS</label><select id="quality"><option value="4">Cepat</option><option value="5" selected>Normal</option><option value="6">Tinggi</option></select></div></div><button class="go" id="go">🎬 GENERATE VIDEO</button><div class="status" id="status"></div><div class="result" id="result"><video id="video" controls playsinline></video><a class="download" id="download" download="grow-ai-video.mp4">⬇ DOWNLOAD MP4</a></div></section><div class="foot">GROW AI VIDEO • WAN 2.2 • ZERO GPU</div></main><script type="module">const SPACE='Saravutw/WAN2.2_I2V_LIGHTNING_4-8step_custom';const $=id=>document.getElementById(id),file=$('file'),preview=$('preview'),go=$('go'),status=$('status');$('drop').onclick=()=>file.click();file.onchange=()=>{let f=file.files[0];if(f){preview.src=URL.createObjectURL(f);preview.hidden=false}};function say(t){status.style.display='block';status.textContent=t}async function client(){say('Menghubungkan Wan 2.2 ZeroGPU…');let m=await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');return m.Client.connect(SPACE)}go.onclick=async()=>{if(!file.files[0])return say('Pilih foto dulu.');let prompt=$('prompt').value.trim();if(!prompt)return say('Isi prompt gerakan dulu.');go.disabled=true;go.classList.add('pulse');$('result').style.display='none';try{let c=await client();say('Terhubung. Mengunggah foto dan masuk antrean GPU…\nJangan tutup halaman sampai video selesai.');let image=file.files[0],duration=Number($('duration').value),quality=Number($('quality').value);let negative='blurry, low quality, chaotic, deformed, watermark, bad anatomy, shaky camera view point';let data={input_image:image,last_image:null,prompt,steps:4,negative_prompt:negative,duration_seconds:duration,guidance_scale:1,guidance_scale_2:1,seed:42,randomize_seed:true,quality,scheduler:'UniPCMultistep',flow_shift:3,frame_multiplier:16,safe_mode:duration>=8,video_component:true};let r=await c.predict('/generate_video',data);let d=r.data||[];let candidates=[];for(let x of d){if(typeof x==='string')candidates.push(x);else if(x&&typeof x==='object'){if(x.url)candidates.push(x.url);if(x.path)candidates.push(x.path)}}let url=candidates.find(x=>typeof x==='string'&&(/\.mp4/i.test(x)||x.includes('/file=')))||candidates[0];if(!url)throw new Error('Video tidak dikembalikan oleh server');$('video').src=url;$('download').href=url;$('result').style.display='block';say('✅ VIDEO SELESAI — siap diputar dan di-download.');}catch(e){console.error(e);say('⚠️ Server ZeroGPU belum menerima proses. Coba tombol GENERATE sekali lagi.\nDetail: '+(e?.message||e));}finally{go.disabled=false;go.classList.remove('pulse')}};</script></body></html>
