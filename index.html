<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d">
<title>GROW AI VIDEO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#13214a 0,#070a14 36%,#03050a 100%);color:#f5f8ff;font-family:Inter,system-ui,sans-serif;min-height:100vh}.app{max-width:620px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom))}.brand{text-align:center;margin:8px 0 24px}.logo{width:70px;height:70px;border:1px solid #38dfff;border-radius:22px;margin:auto;display:grid;place-items:center;font-size:38px;font-weight:900;color:#78efff;box-shadow:0 0 30px #00c8ff66,inset 0 0 20px #00c8ff33}.brand h1{font-size:25px;letter-spacing:4px;margin:14px 0 5px}.brand p{color:#91a0bd;margin:0;font-size:13px}.card{background:#0b1020cc;border:1px solid #253454;border-radius:24px;padding:17px;box-shadow:0 18px 55px #0008}.drop{min-height:240px;border:1px dashed #3c638d;border-radius:19px;display:grid;place-items:center;text-align:center;overflow:hidden;position:relative;background:#070b15}.drop img{width:100%;height:100%;position:absolute;object-fit:contain;background:#05070c}.drop input{display:none}.pick{position:relative;z-index:2;padding:14px 20px;border-radius:14px;border:1px solid #2ad9ff;background:#102337;color:#dffaff;font-weight:800}.field{margin-top:15px}label{font-size:12px;color:#9db0cf;font-weight:800;letter-spacing:.8px}textarea,select{width:100%;margin-top:7px;background:#070b15;border:1px solid #263957;border-radius:14px;color:white;padding:13px;font:inherit;outline:none}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.go{width:100%;margin-top:18px;padding:17px;border:0;border-radius:16px;background:linear-gradient(90deg,#00c8ff,#786cff);color:white;font-size:16px;font-weight:900;letter-spacing:1px;box-shadow:0 0 25px #00c8ff44}.go:disabled{opacity:.5}.status{display:none;margin-top:15px;padding:13px;border-radius:13px;background:#10182a;color:#b9c9e7;font-size:13px}.result{display:none;margin-top:16px}.result video{width:100%;border-radius:16px;background:#000}.download{display:block;text-align:center;text-decoration:none;color:white;border:1px solid #33dfff;padding:13px;border-radius:13px;margin-top:10px;font-weight:800}.foot{text-align:center;color:#566682;font-size:11px;margin-top:18px}.pulse{animation:p 1.3s infinite}@keyframes p{50%{box-shadow:0 0 34px #00d9ff99}}
</style></head><body><main class="app"><header class="brand"><div class="logo">G</div><h1>GROW AI VIDEO</h1><p>IMAGE → CINEMATIC VIDEO • WAN 2.2</p></header><section class="card"><label class="drop" id="drop"><input id="file" type="file" accept="image/*"><span class="pick">＋ PILIH FOTO</span><img id="preview" hidden></label><div class="field"><label>PROMPT GERAKAN</label><textarea id="prompt" placeholder="Contoh: Kamera bergerak perlahan mendekat, rambut dan pakaian bergerak alami tertiup angin, cinematic lighting..."></textarea></div><div class="row"><div class="field"><label>DURASI</label><select id="duration"><option value="2">2 detik • cepat</option><option value="3" selected>3 detik</option><option value="5">5 detik</option></select></div><div class="field"><label>FORMAT</label><select id="ratio"><option value="portrait" selected>9:16 Vertikal</option><option value="landscape">16:9 Landscape</option></select></div></div><button class="go" id="go">🎬 GENERATE VIDEO</button><div class="status" id="status"></div><div class="result" id="result"><video id="video" controls playsinline></video><a class="download" id="download" download="grow-ai-video.mp4">⬇ DOWNLOAD MP4</a></div></section><div class="foot">GROW AI VIDEO • FREE GPU MODE</div></main><script type="module">
const BACKEND={space:'wana14/Wan-2.2-5B'};const $=id=>document.getElementById(id),file=$('file'),preview=$('preview'),go=$('go'),status=$('status');$('drop').onclick=()=>file.click();file.onchange=()=>{const f=file.files[0];if(f){preview.src=URL.createObjectURL(f);preview.hidden=false}};
function say(t){status.style.display='block';status.textContent=t}async function loadClient(){say('Menghubungkan GPU gratis…');const m=await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');return m.Client.connect(BACKEND.space)}
go.onclick=async()=>{if(!file.files[0])return say('Pilih foto dulu.');if(!$('prompt').value.trim())return say('Isi prompt gerakan dulu.');go.disabled=true;go.classList.add('pulse');$('result').style.display='none';try{const client=await loadClient();say('Mengunggah foto dan masuk antrean GPU…');const image=await (await fetch(URL.createObjectURL(file.files[0]))).blob();const portrait=$('ratio').value==='portrait';const h=portrait?1280:704,w=portrait?704:1280;let result;try{result=await client.predict('/generate_video',{image,prompt:$('prompt').value,height:h,width:w,duration_seconds:Number($('duration').value),sampling_steps:28,guide_scale:5,shift:5,seed:-1})}catch(e){result=await client.predict('/generate_video',[image,$('prompt').value,h,w,Number($('duration').value),28,5,5,-1])}const d=result.data||[];const v=d.find(x=>x&&typeof x==='object'&&(x.url||x.path))||d[0];const url=v?.url||v?.path||v;if(!url)throw new Error('Backend tidak mengembalikan video');$('video').src=url;$('download').href=url;$('result').style.display='block';say('✅ Video selesai.');}catch(e){console.error(e);say('⚠️ GPU gratis sedang penuh / backend berubah. Coba lagi beberapa saat. Detail: '+(e.message||e));}finally{go.disabled=false;go.classList.remove('pulse')}};
</script></body></html>
