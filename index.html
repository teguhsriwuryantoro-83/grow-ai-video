;white-space:pre-line}.progress{display:none;margin-top:15px;padding:15px;border:1px solid #243b64;border-radius:16px;background:#080e1d}.progressTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900}.percent{font-size:25px;color:#61e9ff}.track{height:15px;background:#02050b;border:1px solid #243b64;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#00d9ff,#596bff,#a75cff);border-radius:999px;transition:width .5s}.phase{margin-top:9px;color:#aebfe0;font-size:12px}.result{display:none;margin-top:16px}.previewTitle{text-align:center;font-weight:900;margin:5px 0 8px;color:#76ecff;letter-spacing:1px}.result video{width:100%;border-radius:16px;background:#000;margin-top:6px;max-height:70vh}.download{display:none;text-align:center;text-decoration:none;color:white;border:1px solid #33dfff;padding:14px;border-radius:13px;margin-top:10px;font-weight:900;background:#0b1d31}.ready{font-size:12px;color:#9fc0dc;text-align:center;margin-top:8px}.foot{text-align:center;color:#566682;font-size:11px;margin-top:18px}</style></head><body><main class="app"><header class="brand"><div class="logo">G</div><h1>GROW AI VIDEO</h1><span class="badge">ULTRA • WAN 2.2 LIGHTNING A14B</span><p>IMAGE → VIDEO • 8 STEP • ZERO GPU</p></header><section class="card"><label class="drop" id="drop"><input id="file" type="file" accept="image/*"><span class="pick">＋ PILIH FOTO</span><img id="preview" hidden></label><div class="field"><label>PROMPT GERAKAN</label><textarea id="prompt" placeholder="Jelaskan gerakan subjek dan kamera secara spesifik"></textarea></div><div class="row"><div class="field"><label>DURASI</label><select id="duration"><option value="3.5">3.5 detik</option><option value="5" selected>5 detik</option><option value="10">10 detik • sambung otomatis</option></select></div><div class="field"><label>KUALITAS</label><select id="quality"><option value="6">SUPER • 6 steps</option><option value="8" selected>ULTRA • 8 steps</option></select></div></div><button class="go" id="go">✨ GENERATE ULTRA VIDEO</button><div class="progress" id="progress"><div class="progressTop"><span>PROSES LIGHTNING 14B</span><span class="percent" id="percent">0%</span></div><div class="track"><div class="bar" id="bar"></div></div><div class="phase" id="phase">Menyiapkan…</div></div><div class="status" id="status"></div><div class="result" id="result"><div class="previewTitle">▶ PREVIEW HASIL VIDEO</div><video id="video" controls playsinline preload="metadata"></video><div class="ready" id="ready">Memuat preview…</div><a class="download" id="download">⬇ DOWNLOAD VIDEO MP4</a></div></section><div class="foot">GROW AI VIDEO • WAN 2.2 LIGHTNING A14B • ZERO GPU</div></main><script type="module">const SPACE='Saravutw/WAN2.2_I2V_LIGHTNING_4-8step_custom';const $=x=>document.getElementById(x),file=$('file'),preview=$('preview'),go=$('go'),status=$('status');let timer,current=0,activeURL=null;$('drop').onclick=()=>file.click();file.onchange=()=>{if(file.files[0]){preview.src=URL.createObjectURL(file.files[0]);preview.hidden=false}};function say(t){status.style.display='block';status.textContent=t}function setP(n,t){current=Math.max(current,Math.min(100,Math.round(n)));$('progress').style.display='block';$('percent').textContent=current+'%';$('bar').style.width=current+'%';if(t)$('phase').textContent=t}function creep(to,t){clearInterval(timer);timer=setInterval(()=>{if(current<to)setP(current+1,t)},1300)}function stop(){clearInterval(timer)}function reset(){stop();current=0;setP(0,'Menyiapkan Wan 2.2 Lightning…')}async function client(){setP(3,'Menghubungkan Lightning ZeroGPU…');creep(10,'Menunggu GPU gratis…');const m=await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');const c=await m.Client.connect(SPACE);stop();setP(10,'Mesin Lightning terhubung');return c}function urls(r){const a=[];const walk=x=>{if(!x)return;if(typeof x==='string'){if(x.startsWith('http'))a.push(x);return}if(Array.isArray(x))return x.forEach(walk);if(typeof x==='object'){if(x.url)walk(x.url);Object.values(x).forEach(walk)}};walk(r?.data);return [...new Set(a)]}async function getVideoBlob(r){for(const u of urls(r)){try{const q=await fetch(u);if(!q.ok)continue;const b=await q.blob();if(b.size>100000&&(b.type.includes('video')||u.includes('.mp4')||u.includes('/file=')))return b}catch(e){}}throw Error('Output video belum dapat diambil. Coba sekali lagi.')}function enhance(p){return p+', photorealistic cinematic video, natural human biomechanics, preserve exact facial identity, preserve clothing and background, consistent anatomy, realistic skin texture, stable face, stable hands, temporal consistency, smooth physically plausible motion, detailed lighting, sharp fine details, professional camera motion'}const NEG='low quality, worst quality, blurry, soft face, distorted face, identity change, deformed anatomy, malformed hands, extra fingers, missing fingers, extra limbs, duplicate person, warped body, flicker, jitter, frame inconsistency, melting, morphing, oversaturated, overexposed, watermark, text, subtitles, static image, chaotic motion';async function make(c,image,prompt,seconds,start,end,label){setP(start,label);creep(end-2,label);const steps=Number($('quality').value);const payload={input_image:image,last_image:null,prompt:enhance(prompt),steps,negative_prompt:NEG,duration_seconds:Math.min(5,seconds),guidance_scale:1,guidance_scale_2:1,seed:42,randomize_seed:false,quality:8,scheduler:'UniPCMultistep',flow_shift:3,frame_multiplier:24,safe_mode:true,video_component:true};const r=await c.predict('/generate_video',payload);stop();const b=await getVideoBlob(r);setP(end,label+' selesai');return b}async function lastFrame(blob){return new Promise((resolve,reject)=>{const v=document.createElement('video'),u=URL.createObjectURL(blob);v.muted=true;v.playsInline=true;v.onloadedmetadata=()=>v.currentTime=Math.max(.1,v.duration-.08);v.onseeked=()=>{const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{URL.revokeObjectURL(u);b?resolve(new File([b],'continue.jpg',{type:'image/jpeg'})):reject(Error('Gagal mengambil frame sambungan'))},'image/jpeg',.96)};v.onerror=()=>reject(Error('Gagal membaca video bagian pertama'));v.src=u})}function showPreview(blob,name){if(activeURL)URL.revokeObjectURL(activeURL);activeURL=URL.createObjectURL(blob);const v=$('video'),d=$('download');d.style.display='none';$('ready').textContent='Memuat preview…';$('result').style.display='block';v.src=activeURL;v.load();v.onloadedmetadata=()=>{$('ready').textContent='✅ Preview ULTRA siap • periksa sebelum download';d.href=activeURL;d.download=name;d.style.display='block';v.scrollIntoView({behavior:'smooth',block:'center'})}}async function concatNative(b1,b2){try{const [{FFmpeg},{toBlobURL}]=await Promise.all([import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm'),import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm')]);const ff=new FFmpeg(),base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';await ff.load({coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')});await ff.writeFile('a.mp4',new Uint8Array(await b1.arrayBuffer()));await ff.writeFile('b.mp4',new Uint8Array(await b2.arrayBuffer()));await ff.writeFile('list.txt',new TextEncoder().encode("file 'a.mp4'\nfile 'b.mp4'\n"));await ff.exec(['-f','concat','-safe','0','-i','list.txt','-c','copy','final.mp4']);const d=await ff.readFile('final.mp4');return new Blob([d.buffer],{type:'video/mp4'})}catch(e){throw Error('Dua bagian selesai, tetapi browser gagal menyambungkan MP4: '+e.message)}}go.onclick=async()=>{if(!file.files[0])return say('Pilih foto dulu.');const p=$('prompt').value.trim();if(!p)return say('Isi prompt gerakan dulu.');go.disabled=true;$('result').style.display='none';$('download').style.display='none';status.style.display='none';reset();try{const c=await client(),dur=Number($('duration').value);if(dur===10){const b1=await make(c,file.files[0],p,5,11,43,'Lightning membuat bagian 1/2…');setP(45,'Mengunci frame sambungan…');const frame=await lastFrame(b1);const b2=await make(c,frame,p+', continue seamlessly from previous frame, identical identity, identical scene, continuous motion',5,47,88,'Lightning membuat bagian 2/2…');setP(92,'Menyambungkan video final…');const final=await concatNative(b1,b2);showPreview(final,'grow-ai-video-ULTRA-10s.mp4');setP(100,'✅ ULTRA video siap');say('✅ WAN 2.2 LIGHTNING ULTRA SELESAI — preview final tersedia sebelum download.')}else{const b=await make(c,file.files[0],p,dur,11,96,'Lightning 14B membuat video…');showPreview(b,'grow-ai-video-ULTRA.mp4');setP(100,'✅ ULTRA video siap');say('✅ WAN 2.2 LIGHTNING ULTRA SELESAI — periksa preview sebelum download.')}}catch(e){stop();$('phase').textContent='❌ Proses berhenti';say('⚠️ '+(e?.message||'ZeroGPU sedang penuh. Coba lagi beberapa saat.'))}finally{go.disabled=false}};</script></body></html>
