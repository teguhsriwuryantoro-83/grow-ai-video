<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>GROW AI VIDEO</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#13214a 0,#070a14 36%,#03050a 100%);color:#f5f8ff;font-family:Inter,system-ui,sans-serif;min-height:100vh}.app{max-width:620px;margin:auto;padding:22px 18px 40px}.brand{text-align:center;margin:8px 0 24px}.logo{width:70px;height:70px;border:1px solid #38dfff;border-radius:22px;margin:auto;display:grid;place-items:center;font-size:38px;font-weight:900;color:#78efff;box-shadow:0 0 30px #00c8ff66}.brand h1{font-size:25px;letter-spacing:4px}.brand p{color:#91a0bd;font-size:13px}.card{background:#0b1020cc;border:1px solid #253454;border-radius:24px;padding:17px}.drop{min-height:240px;border:1px dashed #3c638d;border-radius:19px;display:grid;place-items:center;overflow:hidden;position:relative;background:#070b15}.drop img{width:100%;height:100%;position:absolute;object-fit:contain}.drop input{display:none}.pick{z-index:2;padding:14px 20px;border-radius:14px;border:1px solid #2ad9ff;background:#102337;color:#dffaff;font-weight:800}.field{margin-top:15px}label{font-size:12px;color:#9db0cf;font-weight:800}textarea,select{width:100%;margin-top:7px;background:#070b15;border:1px solid #263957;border-radius:14px;color:white;padding:13px;font:inherit}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.go{width:100%;margin-top:18px;padding:17px;border:0;border-radius:16px;background:linear-gradient(90deg,#00c8ff,#786cff);color:white;font-size:16px;font-weight:900}.go:disabled{opacity:.55}.status{display:none;margin-top:15px;padding:13px;border-radius:13px;background:#10182a;color:#b9c9e7;font-size:13px;white-space:pre-line}.progress{display:none;margin-top:15px;padding:15px;border:1px solid #243b64;border-radius:16px;background:#080e1d}.progressTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900}.percent{font-size:25px;color:#61e9ff;text-shadow:0 0 16px #00d9ff88}.track{height:15px;background:#02050b;border:1px solid #243b64;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#00d9ff,#596bff,#a75cff);border-radius:999px;transition:width .5s ease;box-shadow:0 0 18px #00d9ffaa}.phase{margin-top:9px;color:#aebfe0;font-size:12px}.result{display:none;margin-top:16px}.result video{width:100%;border-radius:16px;background:#000;margin-top:10px}.download{display:block;text-align:center;text-decoration:none;color:white;border:1px solid #33dfff;padding:13px;border-radius:13px;margin-top:10px;font-weight:800}.foot{text-align:center;color:#566682;font-size:11px;margin-top:18px}</style></head><body><main class="app"><header class="brand"><div class="logo">G</div><h1>GROW AI VIDEO</h1><p>IMAGE → VIDEO • WAN 2.2 LIGHTNING</p></header><section class="card"><label class="drop" id="drop"><input id="file" type="file" accept="image/*"><span class="pick">＋ PILIH FOTO</span><img id="preview" hidden></label><div class="field"><label>PROMPT GERAKAN</label><textarea id="prompt" placeholder="Contoh: natural body movement, cinematic camera, realistic motion, stable face"></textarea></div><div class="row"><div class="field"><label>DURASI</label><select id="duration"><option value="3.5">3.5 detik</option><option value="5" selected>5 detik</option><option value="10">10 detik • 2 bagian otomatis</option></select></div><div class="field"><label>KUALITAS</label><select id="quality"><option value="4" selected>Normal / stabil</option></select></div></div><button class="go" id="go">🎬 GENERATE VIDEO</button><div class="progress" id="progress"><div class="progressTop"><span>PROSES VIDEO</span><span class="percent" id="percent">0%</span></div><div class="track"><div class="bar" id="bar"></div></div><div class="phase" id="phase">Menyiapkan…</div></div><div class="status" id="status"></div><div class="result" id="result"><video id="video1" controls playsinline></video><a class="download" id="download1">⬇ DOWNLOAD BAGIAN 1</a><div id="part2" hidden><video id="video2" controls playsinline></video><a class="download" id="download2">⬇ DOWNLOAD BAGIAN 2</a></div></div></section><div class="foot">GROW AI VIDEO • WAN 2.2 • ZERO GPU</div></main><script type="module">const SPACE='Saravutw/WAN2.2_I2V_LIGHTNING_4-8step_custom';const $=x=>document.getElementById(x),file=$('file'),preview=$('preview'),go=$('go'),status=$('status');let timer=null,current=0,cap=0;$('drop').onclick=()=>file.click();file.onchange=()=>{if(file.files[0]){preview.src=URL.createObjectURL(file.files[0]);preview.hidden=false}};function say(t){status.style.display='block';status.textContent=t}function setProgress(n,text=''){current=Math.max(current,Math.min(100,Math.round(n)));$('progress').style.display='block';$('percent').textContent=current+'%';$('bar').style.width=current+'%';if(text)$('phase').textContent=text}function creep(to,text){clearInterval(timer);cap=to;timer=setInterval(()=>{if(current<cap)setProgress(current+1,text)},1100)}function stopCreep(){clearInterval(timer)}function resetProgress(){stopCreep();current=0;setProgress(0,'Menyiapkan mesin AI…')}async function getClient(){setProgress(3,'Menghubungkan mesin Wan 2.2…');creep(12,'Menghubungkan GPU gratis…');const m=await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');const c=await m.Client.connect(SPACE);stopCreep();setProgress(12,'Mesin terhubung.');return c}function pickUrl(r){let a=[];for(const x of(r.data||[])){if(typeof x==='string')a.push(x);else if(x){if(x.url)a.push(x.url);if(x.path)a.push(x.path)}}return a.find(x=>/\.mp4/i.test(x)||x.includes('/file='))||a[0]}async function make(c,image,prompt,seconds,start,end,label){setProgress(start,label);creep(end-3,label);const data={input_image:image,last_image:null,prompt,steps:4,negative_prompt:'blurry, low quality, chaotic, deformed, watermark, bad anatomy, shaky camera',duration_seconds:seconds,guidance_scale:1,guidance_scale_2:1,seed:42,randomize_seed:true,quality:4,scheduler:'UniPCMultistep',flow_shift:3,frame_multiplier:16,safe_mode:true,video_component:true};const url=pickUrl(await c.predict('/generate_video',data));stopCreep();setProgress(end,label+' selesai');return url}go.onclick=async()=>{if(!file.files[0])return say('Pilih foto dulu.');const prompt=$('prompt').value.trim();if(!prompt)return say('Isi prompt gerakan dulu.');go.disabled=true;$('result').style.display='none';$('part2').hidden=true;status.style.display='none';resetProgress();try{const c=await getClient(),dur=Number($('duration').value);if(dur===10){const u1=await make(c,file.files[0],prompt,5,13,50,'Membuat video bagian 1/2…');if(!u1)throw Error('Bagian 1 gagal dibuat');$('video1').src=u1;$('download1').href=u1;$('download1').download='grow-video-part-1.mp4';$('result').style.display='block';setProgress(52,'Bagian 1 selesai. Menyiapkan bagian 2/2…');const u2=await make(c,file.files[0],prompt+' Continue the motion naturally, cinematic continuity.',5,53,96,'Membuat video bagian 2/2…');if(!u2)throw Error('Bagian 2 gagal dibuat');$('video2').src=u2;$('download2').href=u2;$('download2').download='grow-video-part-2.mp4';$('part2').hidden=false;setProgress(100,'✅ Semua proses selesai');say('✅ VIDEO 10 DETIK SELESAI — 2 bagian siap diputar/download.');}else{const u=await make(c,file.files[0],prompt,dur,13,96,'AI sedang membuat gerakan video…');if(!u)throw Error('Server tidak mengembalikan video');$('video1').src=u;$('download1').href=u;$('download1').download='grow-ai-video.mp4';$('download1').textContent='⬇ DOWNLOAD MP4';$('result').style.display='block';setProgress(100,'✅ Video selesai');say('✅ VIDEO SELESAI.');}}catch(e){stopCreep();$('phase').textContent='❌ Proses berhenti';say('⚠️ Server GPU gratis sedang sibuk atau antrean penuh. Tekan GENERATE lagi beberapa saat lagi.\n'+(e?.message||''));}finally{go.disabled=false}};</script></body></html>
