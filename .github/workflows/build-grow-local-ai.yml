name: Build GROW Local AI APK

on:
  workflow_dispatch:
  push:
    branches: [grow-local-ai-android]
    paths:
      - '.github/workflows/build-grow-local-ai.yml'
      - 'grow-local-ai/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout Android Stable Diffusion app
        uses: actions/checkout@v4
        with:
          repository: akleine/sdcpp-on-android
          path: grow-local-ai-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Brand app as GROW Local AI
        shell: bash
        run: |
          cd grow-local-ai-src
          # Keep the proven native sd.cpp binary shipped by the upstream Android project.
          # Only change visible app branding where matching resources exist.
          if [ -f app/src/main/res/values/strings.xml ]; then
            sed -i 's/>sdcpp-on-android</>GROW Local AI</g; s/>SDCPP on Android</>GROW Local AI</g' app/src/main/res/values/strings.xml || true
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: grow-local-ai-src
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          APK=$(find grow-local-ai-src/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" out/GROW-Local-AI-debug.apk
          sha256sum out/GROW-Local-AI-debug.apk > out/GROW-Local-AI-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GROW-Local-AI-Android
          path: out/*
          if-no-files-found: error
          retention-days: 30
